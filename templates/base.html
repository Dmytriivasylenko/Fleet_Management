<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Fleet Management{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% load static %}

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        :root {
            --primary: #1e3c72;
            --primary-dark: #162c55;
            --danger: #c0392b;
            --gray: #7f8c8d;
            --bg: #f5f7fb;
            --text: #2c3e50;
            --radius: 12px;
            --shadow: 0 20px 50px rgba(0,0,0,.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        a { text-decoration: none; color: inherit; }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 16px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,.15);
        }

        .header-inner {
            max-width: 1200px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        nav ul {
            list-style: none;
            display: flex;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        nav li { margin-left: 20px; }

        nav a {
            font-weight: 500;
            opacity: .85;
        }

        nav a:hover,
        nav a.active {
            opacity: 1;
            text-decoration: underline;
        }

        main {
            max-width: 1200px;
            margin: 32px auto;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
        }

        .btn:hover { background: var(--primary-dark); }
        .btn.red { background: var(--danger); }
        .btn.red:hover { opacity: .9; }
    </style>
</head>

<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

<header>
    <div class="header-inner">
        <strong>Fleet Management</strong>

        <nav>
            <ul>
                <li>
                    <a href="{% url 'fleet:dashboard:home' %}">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="{% url 'fleet:vehicles:vehicle_list' %}">
                        Vehicles
                    </a>
                </li>
                <li>
                    <a href="{% url 'fleet:clients:client_list' %}">
                        Clients
                    </a>
                </li>

                <li>
                    <a href="{% url 'fleet:services:service_history_entry' %}">
                        Service
                    </a>
                </li>

                <li>
                    <a href="{% url 'fleet:reports:report_select' %}">
                        Reports
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</header>


<main>
    <div class="card" id="main-content">
        {% block content %}{% endblock %}
    </div>
</main>

</body>
</html>
