<td>
    {{ service.service_date }}

    {% if service.next_service_date %}
        <div style="font-size:12px;">
            Next: {{ service.next_service_date }}

            {% if service.is_overdue %}
                <span style="
                    margin-left:6px;
                    padding:2px 6px;
                    background:#c0392b;
                    color:#fff;
                    border-radius:6px;
                    font-size:11px;
                ">
                    overdue
                </span>
            {% endif %}
        </div>
    {% endif %}
</td>
