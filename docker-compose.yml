name: Fleet-management-system

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    volumes:
      - .:/app

  celery:
    build: .
    command: celery -A fleet_management worker -l info
    depends_on:
      - redis
      - web
    env_file:
      - .env

  beat:
    build: .
    command: celery -A fleet_management beat -l info
    depends_on:
      - redis
      - web
    env_file:
      - .env

volumes:
  pgdata:
